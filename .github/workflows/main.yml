name: ISAAC INFINITY APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Télécharger le projet
        uses: actions/checkout@v4

      - name: Installer Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Créer le projet Android
        run: |
          mkdir -p app/src/main/java/com/isaac/infinity

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "ISAAC-INFINITY"
          include ':app'
          EOF

          echo "plugins { id 'com.android.application' version '8.7.3' apply false }" > build.gradle

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.isaac.infinity'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.isaac.infinity'
                  minSdk 23
                  targetSdk 35
                  versionCode 1
                  versionName '1.0'
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <application
                  android:theme="@android:style/Theme.Material.Light.NoActionBar"
                  android:label="ISAAC INFINITY"
                  android:usesCleartextTraffic="false">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/isaac/infinity/MainActivity.java <<'EOF'
          package com.isaac.infinity;

          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {
              WebView web;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  web = new WebView(this);
                  web.getSettings().setJavaScriptEnabled(true);
                  web.getSettings().setDomStorageEnabled(true);
                  web.setWebViewClient(new WebViewClient());
                  setContentView(web);
                  web.loadUrl("https://isaac-infinity-vision.onrender.com");
              }

              @Override
              public void onBackPressed() {
                  if (web.canGoBack()) {
                      web.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          EOF

      - name: Construire APK
        run: gradle assembleDebug

      - name: Récupérer APK
        uses: actions/upload-artifact@v4
        with:
          name: ISAAC-INFINITY-APK
          path: app/build/outputs/apk/debug/app-debug.apk
